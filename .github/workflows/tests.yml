name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.9", "3.10", "3.12", "3.13"]
        exclude:
          # GitHub's arm64 runners ship recent interpreters only.
          - os: ubuntu-24.04-arm
            python: "3.9"
          - os: ubuntu-24.04-arm
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python3 -B -m unittest discover -v

  package:
    name: Build and install the Debian package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential debhelper dh-python dpkg-dev python3-all
      - name: Prepare the pinned node_exporter
        run: make vendor DEB_HOST_ARCH=arm64
      - name: Build
        run: dpkg-buildpackage -us -uc -b
      - name: Verify the artifact contents
        run: |
          deb=$(ls ../spark-exporter_*_arm64.deb | head -1)
          echo "artifact: $deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -q 'usr/lib/spark-exporter/node_exporter'
          dpkg-deb --contents "$deb" | grep -q 'usr/share/spark-exporter/prometheus/engine-rules.yml'
      - name: Install and smoke the services
        run: |
          sudo apt-get install --yes "./$(ls ../spark-exporter_*_arm64.deb | head -1)"
          sudo systemctl daemon-reload
          sudo systemctl start spark-node-exporter.service
          sudo systemctl start spark-exporter.service
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9400/metrics > /tmp/metrics.txt && break
            sleep 1
          done
          grep -q '^spark_host_info' /tmp/metrics.txt
          grep -q 'spark_collector_success{collector="block_devices"} 1' /tmp/metrics.txt
          grep -q 'spark_collector_success{collector="usb"} 1' /tmp/metrics.txt
          grep -q '^node_' /tmp/metrics.txt
          systemctl is-active spark-exporter.service
          systemctl is-active spark-node-exporter.service
      - name: Purge and confirm cleanup
        run: |
          sudo apt-get purge --yes spark-exporter
          test ! -e /usr/lib/spark-exporter
          test ! -e /etc/default/spark-exporter
      - name: Collect the artifact into the workspace
        run: |
          mkdir -p dist
          cp ../spark-exporter_*_arm64.deb ../spark-exporter_*_arm64.buildinfo ../spark-exporter_*_arm64.changes dist/
          sha256sum dist/*.deb | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spark-exporter-arm64-deb
          path: dist/
          if-no-files-found: error
